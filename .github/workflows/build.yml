name: Build

on:
  # A build on main is started by hand (Run workflow): pushes to main build nothing.
  push:
    tags:
      - "[0-9][0-9].[0-9][0-9][0-9].[0-9][0-9][0-9]"
  pull_request:
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Also publish this run's compiler cache as the build-cache snapshot (run it on main)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The two write entries are for the attestation step only: a signing identity for this run,
    # and storing the attestation. A pull request from a fork gets neither, whatever is asked.
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CCACHE_DIR: ${{ github.workspace }}/.deps/ccache
      CCACHE_MAXSIZE: 500M
      HOST_CXX: clang++-18

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # clang-tidy is a local check (make tidy); it is not installed or run here.
      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 clang-format-18 lld-18 llvm-18 clang-19 lld-19 llvm-19-dev libclang-19-dev libclang-cpp19-dev libclc-19-dev libllvmspirvlib-19-dev cmake glslc glslang-tools spirv-headers spirv-tools python3-venv libzstd-dev zlib1g-dev libedit-dev libffi-dev libxml2-dev libgl-dev bison flex make ninja-build ccache pkg-config tar unzip wget

      - name: Restore dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .deps/native
            .deps/pacbrew
          key: deps-${{ runner.os }}-${{ runner.arch }}-ubuntu24-python313-${{ hashFiles('tools/setup-*-dependencies.sh') }}

      # The interface kit at its pinned commit, the Noto Sans faces and the fonts baked
      # from both. The scripts check what they find, so a stale entry is only slower.
      - name: Restore interface kit and baked fonts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .deps/ui-kit/checkout
            .deps/fonts
            build/fonts
          key: interface-${{ runner.os }}-${{ hashFiles('tools/prepare-ui-kit.sh', 'tools/bake-fonts.sh', 'tools/fetch-cjk-fonts.sh', 'tools/cjk-ranges.py', 'tools/convert-ui-font.py', 'tools/font-baker/**', 'assets/fonts/**') }}

      - name: Restore compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .deps/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-clang18-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-clang18-

      # GitHub drops a cache nobody used for a week, and a pull request only sees main's. When
      # nothing was restored, start from the snapshot kept as a file of the build-cache release;
      # a manual run on main with "snapshot" ticked replaces that file (build-cache.yml).
      - name: Fetch the compiler cache snapshot
        run: |
          if [ -z "$(ls -A "$CCACHE_DIR" 2>/dev/null)" ]; then
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/build-cache/ccache-clang18.tar"
            if curl -fsSL --retry 3 -o "$RUNNER_TEMP/ccache-clang18.tar" "$url"; then
              mkdir -p "$CCACHE_DIR"
              tar -xf "$RUNNER_TEMP/ccache-clang18.tar" -C "$CCACHE_DIR"
              rm "$RUNNER_TEMP/ccache-clang18.tar"
              echo "::notice title=Compiler cache::Started from the build-cache snapshot."
            fi
          fi

      - name: Configure parallel compilation
        run: |
          echo "BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"
          echo "USE_CCACHE=1" >> "$GITHUB_ENV"
          ccache --zero-stats

      - name: Read app identity and version
        shell: bash
        run: |
          metadata=$(python3 -c 'import json; p=json.load(open("sce_sys/param.json")); print(p["titleId"], p["contentVersion"])')
          read -r title_id content_version <<< "$metadata"
          [[ $title_id =~ ^PPSA[0-9]{5}$ ]] || exit 2
          [[ $content_version =~ ^[0-9]{2}\.[0-9]{3}\.[0-9]{3}$ ]] || exit 2
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "$content_version" ]]; then
            echo "Release tag must exactly match param.json contentVersion: $content_version" >&2
            exit 2
          fi
          echo "TITLE_ID=$title_id" >> "$GITHUB_ENV"
          echo "CONTENT_VERSION=$content_version" >> "$GITHUB_ENV"

      # A pull request's build is named by its number and its own commit, on the
      # artifact and inside the app folder (docs/PULL_REQUEST_BUILDS.md); the
      # version in param.json stays the release's.
      - name: Name this build
        id: label
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            short=${PR_HEAD:0:7}
            echo "artifact=${GITHUB_REPOSITORY##*/}-PR$PR_NUMBER-$short" >> "$GITHUB_OUTPUT"
            echo "BUILD_LABEL=PR $PR_NUMBER, $short" >> "$GITHUB_ENV"
          else
            echo "artifact=prosperoai-release-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate source and assets
        run: make lint

      - name: Fetch pinned runtime test headers
        run: python3 tools/deps.py fetch llama-cpp llama-prism

      - name: Run host regression tests
        run: make test

      - name: Reproduce clean-room runtime shim
        run: make libc

      - name: Verify generated runtime
        run: cd runtime && sha256sum --check --strict libc.prx.sha256

      - name: Restore Vulkan build inputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .deps/mihawk-vulkan-review
            .deps/mihawk-mesa-review
            .deps/mihawk-sdk-review
            .deps/Vulkan-Headers
            .deps/vulkan-host
          key: vulkan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/deps.json', 'tools/setup-vulkan-ci.sh') }}

      - name: Build pinned Vulkan driver
        run: bash tools/setup-vulkan-ci.sh

      - name: Build model-free release
        run: make app-release

      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats

      # ccache compresses what it stores, so the snapshot is a plain tar.
      - name: Pack the compiler cache snapshot
        if: github.event_name == 'workflow_dispatch' && inputs.snapshot
        run: tar -cf "$RUNNER_TEMP/ccache-clang18.tar" -C "$CCACHE_DIR" .

      - name: Upload the compiler cache snapshot
        if: github.event_name == 'workflow_dispatch' && inputs.snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ccache-snapshot
          path: ${{ runner.temp }}/ccache-clang18.tar
          if-no-files-found: error
          retention-days: 1

      - name: Verify and archive release
        shell: bash
        run: |
          set -euo pipefail
          unexpected=$(find "dist/$TITLE_ID/models" -type f ! -name README.txt -print -quit)
          [[ -z $unexpected ]] || {
            echo "Release unexpectedly contains model data: $unexpected" >&2
            exit 2
          }
          cd dist
          test -f "$TITLE_ID.zip"
          # The console only starts an app whose files are open to all, and some tools
          # keep a ZIP's permissions when unpacking: every entry must be stored as 0777.
          python3 - "$TITLE_ID.zip" "$TITLE_ID" "$CONTENT_VERSION" <<'PY'
          import json, sys, zipfile
          archive, title, version = sys.argv[1:4]
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None, "damaged ZIP entry"
              names = z.namelist()
              assert all(n.startswith(title + "/") for n in names), "entries outside the app folder"
              assert title + "/eboot.bin" in names, "no eboot.bin"
              wrong = [i.filename for i in z.infolist() if (i.external_attr >> 16) & 0o777 != 0o777]
              assert not wrong, f"entries not stored as 0777: {wrong[:3]}"
              meta = json.loads(z.read(title + "/sce_sys/param.json"))
              assert meta["contentVersion"] == version, meta["contentVersion"]
              print(f"{archive}: {len(names)} entries, all 0777, version {version}")
          PY
          sha256sum "$TITLE_ID.zip" > SHA256SUMS
          cat SHA256SUMS

      # Signed provenance: this ZIP was built by this workflow from this commit. Anyone can check a
      # downloaded copy with `gh attestation verify <file> -R <owner>/<repo>`. Not for pull requests
      # (a fork's run cannot sign), and not in a private repository (the plan does not include it).
      - name: Attest the release ZIP
        if: github.event_name != 'pull_request' && !github.event.repository.private
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ env.TITLE_ID }}.zip

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.label.outputs.artifact }}
          path: |
            dist/${{ env.TITLE_ID }}.zip
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Download verified build
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download "$GITHUB_RUN_ID"
          --repo "$GITHUB_REPOSITORY"
          --name "prosperoai-release-$GITHUB_SHA"
          --dir release

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          cd release
          test "$(find . -type f | wc -l)" -eq 2
          sha256sum --check --strict SHA256SUMS

      - name: Prepare release notes
        shell: bash
        run: |
          awk -v version="$GITHUB_REF_NAME" '
            $0 == "## " version { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(release/PPSA99004.zip release/SHA256SUMS)
          TAG=$GITHUB_REF_NAME
          # CI is the source of truth for release files: create the release, or fill one that
          # has no ZIP yet, and never replace a ZIP that is already published.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --title "ProsperoAI $TAG" --notes-file release-notes.md
            exit 0
          fi
          existing=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          while IFS= read -r name; do
            if [[ $name == *.zip ]]; then
              echo "::warning title=Release files not from this run::A release for $TAG already has a ZIP; it was not replaced. Its files were not published by this run and may have no attestation."
              exit 0
            fi
          done <<< "$existing"
          # Notes written in advance, or a draft: add the two files, leave title and notes alone.
          gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY"

  vulkan-runtime:
    name: vulkan-runtime ABI and media correctness
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HOST_CXX: clang++-18
      CC: clang-18
      CXX: clang++-18
      BUILD_JOBS: 4
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      CCACHE_MAXSIZE: 1G
      PROSPERO_REQUIRE_VULKAN_RUNTIME: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install host Vulkan toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 cmake ninja-build ccache glslc spirv-headers libvulkan-dev libespeak-ng-dev mesa-vulkan-drivers vulkan-tools git unzip
      - name: Restore Vulkan runtime compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/ccache
          key: ccache-vulkan-${{ runner.os }}-${{ runner.arch }}-clang18-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-vulkan-${{ runner.os }}-${{ runner.arch }}-clang18-
      - name: Select the software Vulkan driver
        shell: bash
        run: |
          software=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$software"
          echo "VK_ICD_FILENAMES=$software" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$software" vulkaninfo --summary
      - name: Fetch pinned vulkan-runtime sources
        run: python3 tools/deps.py fetch llama-prism vulkan-headers stable-diffusion-vulkan
      - name: Build vulkan-runtime and test binaries
        run: bash tools/build-vulkan-runtime.sh host
      - name: Run mandatory ABI and Vulkan media tests
        run: python3 -m unittest discover -s tests -p test_vulkan_runtime.py -v
      - name: Report Vulkan runtime compiler cache statistics
        if: always()
        run: ccache --show-stats
